<!-- //first taslk// -->
<h2>AI Fundamentals</h2>

<div class="cards-grid">
  <mat-card *ngFor="let post of postArr" class="example-card">

    <mat-card-header>
      <mat-card-title>{{ post.topic }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <p>{{ post.details }}</p>
    </mat-card-content>

    <mat-card-actions>
      <button mat-raised-button color="primary">Edit</button>
      <button mat-raised-button color="warn">Remove</button>
    </mat-card-actions>

  </mat-card>
</div>
